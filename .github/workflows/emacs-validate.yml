name: Org compatibility (Emacs)

# Installs Emacs on the GitHub runner and checks that the org files in
# test-fixtures/org work with org-mode, org-roam and org-ql.

on:
  push:
    branches: [master, mi-rama-0.10.15]
    paths:
      - 'test-fixtures/org/**'
      - 'scripts/emacs/**'
      - '.github/workflows/emacs-validate.yml'
  pull_request:
    branches: [master, mi-rama-0.10.15]
    paths:
      - 'test-fixtures/org/**'
      - 'scripts/emacs/**'
      - '.github/workflows/emacs-validate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  emacs-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          emacs --version | head -1

      - name: Cache Emacs packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/logseq-eli-elpa
          key: elpa-v1-${{ runner.os }}

      - name: Validate org files
        env:
          FIXTURES_DIR: test-fixtures/org
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          emacs --batch -l scripts/emacs/validate.el 2>&1 | tee emacs-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '**Emacs validation failed** (last lines of the output):'
              echo '```'
              tail -n 60 emacs-output.txt
              echo '```'
            } > emacs-comment.md
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -F body=@emacs-comment.md || true
            fi
          fi
          exit "$status"
